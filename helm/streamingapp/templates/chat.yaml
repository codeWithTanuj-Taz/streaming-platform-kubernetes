apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  labels:
    app: chat
spec:
  replicas: {{ .Values.replicaCount.chat }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
    spec:
      serviceAccountName: streamingapp-sa
      containers:
        - name: chat
          image: "{{ .Values.images.chat.repository }}:{{ .Values.images.chat.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.services.chat.port }}
              name: http
          env:
            - name: PORT
              value: "{{ .Values.services.chat.port }}"
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: MONGO_URI
            - name: CLIENT_URLS
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: CLIENT_URLS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: streamingapp-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.services.chat.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.services.chat.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: chat-svc
  labels:
    app: chat
spec:
  type: ClusterIP
  selector:
    app: chat
  ports:
    - port: {{ .Values.services.chat.port }}
      targetPort: {{ .Values.services.chat.port }}
      name: http
