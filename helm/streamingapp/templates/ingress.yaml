apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streamingapp-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api/streaming
            pathType: Prefix
            backend:
              service:
                name: streaming-svc
                port:
                  number: {{ .Values.services.streaming.port }}

          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: admin-svc
                port:
                  number: {{ .Values.services.admin.port }}

          - path: /api/chat
            pathType: Prefix
            backend:
              service:
                name: chat-svc
                port:
                  number: {{ .Values.services.chat.port }}

          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: chat-svc
                port:
                  number: {{ .Values.services.chat.port }}

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: auth-svc
                port:
                  number: {{ .Values.services.auth.port }}

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: {{ .Values.services.frontend.port }}
