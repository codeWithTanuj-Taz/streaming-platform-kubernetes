apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming
  labels:
    app: streaming
spec:
  replicas: {{ .Values.replicaCount.streaming }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: streaming
  template:
    metadata:
      labels:
        app: streaming
    spec:
      serviceAccountName: streamingapp-sa
      containers:
        - name: streaming
          image: "{{ .Values.images.streaming.repository }}:{{ .Values.images.streaming.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.services.streaming.port }}
              name: http
          env:
            - name: PORT
              value: "{{ .Values.services.streaming.port }}"
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: MONGO_URI
            - name: CLIENT_URLS
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: CLIENT_URLS
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: AWS_REGION
            - name: AWS_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: AWS_S3_BUCKET
            - name: AWS_CDN_URL
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: AWS_CDN_URL
            - name: STREAMING_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: STREAMING_PUBLIC_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: streamingapp-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.services.streaming.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.services.streaming.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-svc
  labels:
    app: streaming
spec:
  type: ClusterIP
  selector:
    app: streaming
  ports:
    - port: {{ .Values.services.streaming.port }}
      targetPort: {{ .Values.services.streaming.port }}
      name: http
